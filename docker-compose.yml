version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: customer_insights_api
    ports:
      - "8000:8000"
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: customer_insights_ui
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    restart: unless-stopped
    depends_on:
      - api
