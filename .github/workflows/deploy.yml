name: Build, Test, and Containerize Cloud Service

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify PyTorch Model and API Integrity
        run: |
          python -c "import model; print('Model module OK')"
          python -c "import api; print('FastAPI API OK')"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Container
        run: |
          docker build -t customer-insights-dashboard:latest .
          docker images
